[package]
name = "lincy"
version = "0.1.0"
edition = "2024"
description = "A lightweight clipboard manager for GNOME/Wayland, inspired by Maccy"
license = "MIT"
repository = "https://github.com/edumrodrigues/lincy"
homepage = "https://github.com/edumrodrigues/lincy"
documentation = "https://github.com/edumrodrigues/lincy#readme"
readme = "README.md"
keywords = ["clipboard", "manager", "wayland", "gtk4", "gnome"]
categories = ["gui", "utility"]

[dependencies]
# GTK4 + GDK4 (for clipboard textures)
gtk4 = { version = "0.11", features = ["v4_14"] }
gdk4 = "0.11"

# System tray via D-Bus StatusNotifierItem (pure Rust, no GTK3/GTK4 conflict)
ksni = { version = "0.3", features = ["blocking"] }

# Clipboard (uses X11 via XWayland on Wayland sessions)
arboard = "3.6"

# Hotkey via xdg-desktop-portal
ashpd = { version = "0.13", features = ["global_shortcuts"] }

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Async runtime (for ashpd hotkey portal)
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Hashing (for clipboard content deduplication)
sha2 = "0.11"

# Error handling
thiserror = "2"

# XDG paths + settings
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true