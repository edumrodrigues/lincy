<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5A8E;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)"/>
  <!-- Clipboard board -->
  <rect x="28" y="24" width="72" height="84" rx="6" fill="#E8F0FE" stroke="#1A3A5C" stroke-width="2"/>
  <!-- Clipboard clip -->
  <rect x="44" y="18" width="40" height="12" rx="4" fill="#B0C4DE" stroke="#1A3A5C" stroke-width="2"/>
  <!-- Line 1 -->
  <rect x="36" y="42" width="56" height="4" rx="2" fill="#5A7FA0"/>
  <!-- Line 2 -->
  <rect x="36" y="54" width="48" height="4" rx="2" fill="#5A7FA0"/>
  <!-- Line 3 -->
  <rect x="36" y="66" width="52" height="4" rx="2" fill="#5A7FA0"/>
  <!-- Line 4 (shorter, hinting at text) -->
  <rect x="36" y="78" width="36" height="4" rx="2" fill="#5A7FA0"/>
  <!-- Pin icon overlay (top-right) -->
  <g transform="translate(84, 28)">
    <circle cx="10" cy="10" r="14" fill="#FF6B35" stroke="#C44D1E" stroke-width="1.5"/>
    <path d="M10 4 L10 16 M4 10 L16 10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Magnifying glass overlay (bottom-left) -->
  <g transform="translate(22, 76)">
    <circle cx="12" cy="12" r="10" fill="#FF6B35" stroke="#C44D1E" stroke-width="1.5"/>
    <line x1="19" y1="19" x2="26" y2="26" stroke="#C44D1E" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>